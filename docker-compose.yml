services:
  postgres:
    image: postgres:16-alpine
    container_name: produce_shop_postgres
    environment:
      POSTGRES_DB: produce_shop
      POSTGRES_USER: produce_shop
      POSTGRES_PASSWORD: produce_shop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U produce_shop -d produce_shop"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: produce_shop_backend
    env_file:
      - ./backend/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://produce_shop:produce_shop@postgres:5432/produce_shop
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app/uploads:/app/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: produce_shop_frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:

